# Plasma Opening Switch, Liu, Cai, Cao & Lapenta 2025 (JCP 528:113840), Sec. 5.3,
# high density, paper Fig. 7: n_in = 1e+20 m^-3, compared at t = 0.026 t0.
#
# Build: fmihpc/vlasiator dev 0a825d46b + ES_FS/LCCL patches 0001-0027, and
#   DISTRIBUTION_FP_PRECISION = DPF:
#   in single precision the acceleration step loses ~2.8e-6 of the electrons per step,
#   a net charge worth 1e5-1e6 E0 of vacuum field at n_in = 1e20.
#
# Paper reference values (Sec. 2.1; x0 = L, T0 = Te, n0 = n_in, m0 = me):
#   v0 = 1.326205e+06 m/s, t0 = 1.508062e-07 s, B0 = 3.770156e-05 T, E0 = 50 V/m,
#   c = 226.05 v0, lambda = lambda_D/L = 1.1754e-05, vth_i = 8.9669e+03 m/s.
#
# Same as the paper: L; step slab on [0.05, 0.15] m; n_in; Te = Ti = 10 eV Maxwellians;
#   carbon ions; zero initial fields; Ey,in(t) waveform; 100 cells on [0, L];
#   dt = 7.5e-5 t0; theta = 1; Gauss correction; electron dvx = 0.25 v0; one velocity
#   mesh for all three densities; incident wave at x- with outgoing waves absorbed
#   (Ey + c Bz = Ey,in, which reproduces the paper's Bz at 1e16); absorbing x+;
#   no particle inflow.
# Still different from the paper:
#   - Vlasiator remap with a sparse velocity mesh instead of CSL + positivity limiter.
#   - Velocity meshes wider than the paper's, finer in vy, and 3V (vz is inert here).
#   - Order-8 Shapiro filter on E and B, for a mode of this discretization the paper's
#     finite-element solver does not have.
# Low density reproduces Fig. 5 within a few percent. At 1e18 and 1e20 expect vacuum Bz
# ~9% below the paper's (also in 1D models of the boundary; cause not found).

dynamic_timestep = 0
project = MultiPeak
ParticlePopulations = electron
ParticlePopulations = ion
propagate_field = 1
propagate_vlasov_translation = 1
propagate_vlasov_acceleration = 1

[io]
diagnostic_write_interval = 10
write_initial_state = 1
# t_cmp/50, so an output falls on t_cmp (within one dt).
system_write_t_interval = 7.841924203e-11
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0
system_write_file_name = bulk

[gridbuilder]
# Vlasiator makes the outer 2 layers per face boundary cells; 2 extra cells per side
# put the 100 solved cells exactly on [0, L].
x_length = 104
y_length = 1
z_length = 1
x_min = -0.004
x_max = 0.204
y_min = 0.0
y_max = 2.000000e-03
z_min = 0.0
z_max = 2.000000e-03
# 7.5e-5 t0 = 0.9 dx / (120 v0), as in the paper.
dt = 1.131046760e-11
# Two steps past t_cmp so end-of-run timing cannot drop the t_cmp output.
t_max = 3.943583037e-09

[bailout]
min_dt = 1e-14
velocity_space_wall_block_margin = 1

[boundaries]
periodic_x = no
periodic_y = yes
periodic_z = yes
boundary = Maxwellian
boundary = Outflow

[maxwellian]
face = x-

[electron_outflow]
face = x+

[ion_outflow]
face = x+

[variables]
output = populations_vg_rho
output = populations_vg_v
output = populations_vg_ptensor
output = populations_vg_blocks
output = vg_rhom
output = vg_rhoq
output = fg_e
output = fg_b
output = vg_e_vol
output = vg_b_vol
output = vg_gridcoordinates
# Lets plot_pos.py exclude boundary cells exactly.
output = vg_boundarytype
output = vg_rank
diagnostic = populations_vg_blocks

[fieldsolver]
method = LCCL
theta = 1.0
enforceGaussLaw = 1
# The centred stencils of this collocated solver cannot see a cell-to-cell pattern, so
# nothing damps it (+-2% in vacuum Bz, +-5e4 E0 in vacuum Ex at 1e18 without a filter).
# Order 8 removes it; the 3-point filter (order 2) also doubled the width of the 1e18
# screening layer, order 8 leaves it at the unfiltered width (1D replica).
lowPassFilter = 1
lowPassFilterOrder = 8
# Gauss correction with phi pinned only at x-: pinned at both walls, the sheaths' potential
# step comes back through both vacuum gaps as uniform fields (seen at 1e18), which the
# paper's figures do not have.
gaussLawOutflowNeumann = 1
# Stock Outflow pins E = 0 (a conducting wall); the paper absorbs outgoing waves.
outflowAbsorbing = 1
# Pinning Bz with E = 0 at x- drives one of the two sub-lattices of the collocated
# stencils; with lowPassFilter mixing them that delivered ~0.66 of the paper's field.
inflowCharacteristic = 1

[MultiPeak]
Bx = 0.0
By = 0.0
Bz = 0.0
dBx = 0.0
dBy = 0.0
dBz = 0.0
lambda = 0.2
magXPertAbsAmp = 0.0
magYPertAbsAmp = 0.0
magZPertAbsAmp = 0.0
densityModel = slab
slabMinX = 0.05
slabMaxX = 0.15
# The paper's step. Far below dx/2, so every cell centre gets exactly 0 or n_in without
# depending on how the smoothing patch treats a width of 0.
slabTransitionWidth = 1.0e-6

[electron_properties]
mass = 1
mass_units = ELECTRON
charge = -1

[electron_vspace]
# vx: -107 v0 holds electrons falling back through the driven sheath (the paper's own
# sheath potential at 1e18 is ~32 kV, i.e. ~80 v0). +130 v0 is the most the translation can
# carry: it needs |vx| dt/dx < 1 (133 v0 here) and does not check it (the test in
# cpu_trans_map_amr.cpp is commented out), so a wall bailout is preferable to more room;
# halve dt if that bailout appears.
# vx, vz: 1 v0 blocks (0.25 v0 cells, the paper's dvx). vy: 2.5 v0 blocks (0.625 v0 cells),
# finer than the paper's 1.25 v0 because Vlasiator point-samples the initial Maxwellian:
# at 1.25 v0 the electron density comes out 6.5e-6 low, a net slab charge worth
# ~2.4e4 E0 at n_in = 1e20.
# Extents hold the paper's own Fig. 5 drifts (u_ex ~ 20 v0, u_ey ~ 100 v0) plus gyration.
vx_min = -1.419039475e+08
vx_max = 1.724066651e+08
vy_min = -3.282357663e+08
vy_max = 3.282357663e+08
vz_min = -7.161507629e+07
vz_max = 7.161507629e+07
vx_length = 237
vy_length = 198
vz_length = 108

[electron_sparse]
# 1e-8 of the n_in Maxwellian peak (was e^-8). A thermal population is deleted outright only
# below ~1e-8 n_in, so each such deletion moves Ex by < 1 E0 even at n_in = 1e20.
minValue = 2.722063e-08
# Partial deletions are rescaled away, keeping each cell's charge; the paper's CSL
# conserves mass exactly.
conserve_mass = 1

[electron_MultiPeak]
n = 1
Vx = 0.0
Vy = 0.0
Vz = 0.0
Tx = 116045.181
Ty = 116045.181
Tz = 116045.181
rho = 1.0e+20
rhoPertAbsAmp = 0.0

[electron_maxwellian]
dynamic = 1
# Floor density 1 m^-3, ~1e+12 below this threshold: no inflow.
file_x- = pos_electron_maxwellian_x-.dat

[ion_properties]
mass = 21874.661835
mass_units = ELECTRON
charge = 1

[ion_vspace]
# vth_i/4 cells (same cells per sigma as electron vx). +-16 vth_i holds the ~6 sigma tail
# kept by minValue plus a few vth_i of sheath acceleration. The earlier high-density +-1 v0
# extension was sized to the unphysical vacuum field; a wall bailout here now flags that field.
vx_min = -1.434696397e+05
vx_max = 1.434696397e+05
vy_min = -1.434696397e+05
vy_max = 1.434696397e+05
vz_min = -1.434696397e+05
vz_max = 1.434696397e+05
vx_length = 32
vy_length = 32
vz_length = 32

[ion_sparse]
minValue = 8.806638e-02
conserve_mass = 1

[ion_MultiPeak]
n = 1
Vx = 0.0
Vy = 0.0
Vz = 0.0
Tx = 116045.181
Ty = 116045.181
Tz = 116045.181
rho = 1.0e+20
rhoPertAbsAmp = 0.0

[ion_maxwellian]
dynamic = 1
file_x- = pos_ion_maxwellian_x-.dat
