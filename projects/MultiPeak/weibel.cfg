# Weibel instability of Liu, Cai, Cao & Lapenta (2025, JCP 528:113840), Sec. 5.2 / Eq. (51),
# with Vlasiator's MultiPeak project.
#   square-cells, CFL = 1
#   electron dv_x = dv_y = 0.025 v0 (vy: +-6.8 v0, 136 blocks), dv_z = 0.01875 v0;
#   output: bulk every 0.3 t0 without VDFs, distributions every 3 t0 (cells 33, 66, 99)
# Gyration rotates structure that is narrow in vx into vy, so a coarser vy spacing limits the
# rotation's accuracy; square cells remove that.
#
# Units. The paper uses c = 1 in units of v0 = sqrt(kB*Te/me). Weibel growth depends on
# k*c/omega_pe, so c/v0 = 1 has to be kept: v0 = c_SI, i.e. Te = me*c^2/kB. Both the paper's
# system and Vlasiator are nonrelativistic, so this reproduces the paper's problem exactly
# (it is not a physical plasma).
#   v0 = c = 299792458 m/s, ne = 1e6 m^-3, Te = 5.929897e9 K
#   omega_pe = 5.641460e4 rad/s, t0 = 1/omega_pe = 1.772591e-5 s
#   x0 = lambda_D = 5314.09 m, B0 = me*v0/(q*lambda_D) = 3.207526e-7 T
#   beta = 0.04, Tr = 12: Tx = (beta/2)*Te = 1.185979e8 K, Ty = Tr*Tx = 1.423175e9 K,
#     Tz = Tx (vz does not couple; the paper is 1d2v)
#   k = 1.25/lambda_D, Lx = 2*pi/k = 26711.55 m, Nx = 128: dx = 208.684 m = 0.0393 lambda_D
#   dt = C*dx/(4.14*v0) with C = 1: 1.681388e-7 s; t_max = 50 t0 (~5271 steps)
#   dBz = alpha0*B0 = 3.207526e-10 T (alpha0 = 1e-3)
# Ions are a Vlasov population with mass 1e5 me and T = Te (the paper uses a static background).

dynamic_timestep = 0
project = MultiPeak
ParticlePopulations = electron
ParticlePopulations = ion

propagate_field = 1
propagate_vlasov_translation = 1
propagate_vlasov_acceleration = 1

[io]
diagnostic_write_interval = 10
write_initial_state = 1
system_write_t_interval = 5.317773e-06
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0
system_write_t_interval = 5.317773e-05
system_write_file_name = distributions
system_write_distribution_stride = 33
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[gridbuilder]
# Nx = 128 cells over Lx = 2*pi/k; one cell in y and z (1d3v).
x_length = 128
y_length = 1
z_length = 1
x_min = 0.0
x_max = 26711.54616172343
y_min = 0.0
y_max = 208.6839543884643
z_min = 0.0
z_max = 208.6839543884643

# C = 1 (paper): dt = dx/(4.14*v0); C = 0.5 would be dt = 8.4069413560338815e-8
dt = 1.6813882712067763e-07
# t_max = 50 t0
t_max = 8.862953552991043e-04

[bailout]
min_dt = 1e-12
velocity_space_wall_block_margin = 1

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = yes

[variables]
output = populations_vg_rho
output = populations_vg_v
output = populations_vg_ptensor
output = populations_vg_blocks

output = vg_rhom
output = vg_rhoq

output = fg_e
output = fg_b
output = vg_e_vol
output = vg_b_vol

output = vg_gridcoordinates
output = vg_rank
diagnostic = populations_vg_blocks

[fieldsolver]
# LCCL solver (Liu et al. 2025) with theta = 1/2 and the Gauss's law correction.
method = LCCL
theta = 0.5
enforceGaussLaw = 1

[MultiPeak]
# Uniform density; Bz = dBz*cos(2*pi*x/lambda) with lambda = Lx seeds the mode.
Bx = 0.0
By = 0.0
Bz = 0.0
dBx = 0.0
dBy = 0.0
dBz = 3.207525611846941e-10
lambda = 26711.54616172343
magXPertAbsAmp = 0.0
magYPertAbsAmp = 0.0
magZPertAbsAmp = 0.0
densityModel = uniform

[electron_properties]
mass = 1
mass_units = ELECTRON
charge = -1

[electron_vspace]
# dv = 0.025 v0 in vx and vy (square cells), 0.01875 v0 in vz:
#   vx +-2.6 v0 (52 blocks), vy +-6.8 v0 (136 blocks), vz +-1.35 v0 (36 blocks).
# At t = 0 the content (to ~6.8 vth at minValue = 2.5e-29) is >= 16, 34 and 5 blocks from the
# vx, vy and vz walls; vx leaves room for the late-time heating, vz does not couple.
vx_min = -779460390.8
vx_max = +779460390.8
vy_min = -2038588714.3999999
vy_max = +2038588714.3999999
vz_min = -404719818.29999995
vz_max = +404719818.29999995
vx_length = 52
vy_length = 136
vz_length = 36

[electron_sparse]
# f_peak = 2.405e-19 s^3/m^6; minValue ~1e-10 of it keeps content to ~6.8 vth.
minValue = 2.5e-29

[electron_MultiPeak]
n = 1
Vx = 0.0
Vy = 0.0
Vz = 0.0
Tx = 118597931.50647102
Ty = 1423175178.0776522
Tz = 118597931.50647102
rho = 1.0e6
rhoPertAbsAmp = 0.0

[ion_properties]
mass = 1.0e5
mass_units = ELECTRON
charge = 1

[ion_vspace]
# +-10.8 vth_ion (vth_ion = 9.480e5 m/s), dv = 0.3 vth_ion: 3 empty blocks between the
# content edge (~7.2 vth_ion at minValue = 3e-25) and the walls.
vx_min = -10238691.520299964
vx_max = +10238691.520299964
vy_min = -10238691.520299964
vy_max = +10238691.520299964
vz_min = -10238691.520299964
vz_max = +10238691.520299964
vx_length = 18
vy_length = 18
vz_length = 18

[ion_sparse]
# f_peak = 7.452e-14 s^3/m^6; minValue ~4e-12 of it: no initial density deficit.
minValue = 3.0e-25

[ion_MultiPeak]
n = 1
Vx = 0.0
Vy = 0.0
Vz = 0.0
Tx = 5929896575.323551
Ty = 5929896575.323551
Tz = 5929896575.323551
rho = 1.0e6
rhoPertAbsAmp = 0.0
