# GEM reconnection challenge as in Liu, Cai, Cao & Lapenta 2025, JCP 528:113840,
# Section 5.4: one Harris sheet between conducting walls, periodic in x.
# See derive_double_harris.py's module docstring.
#
# Stage: 2D GEM run; 128 x 68 cells, t_max = 40/w_ci (2000 steps).
# Overrides: GEOMETRY=single NY=128 DT_TCI=0.02 THETA=0.55 DV_ELECTRON=0.3 ELECTRON_VMAX_MULTIPLE=12.0 DV_ION=0.5 ION_VMAX_MULTIPLE=16.0 SPARSITY_REL_BACKGROUND=1e-4 WALL_BLOCK_MARGIN=0 MODE=2d FROZEN_FIELDS=False T_MAX_TCI=40.0 SYMMETRY_SEED=0 RESTART_WALLTIME=7200.0 CFG_TAG=_paperdt_th055
#
# Requires: petschge/vlasiator ca0a894 or later; harris-single-sheet.patch for the face-evaluated single-sheet perturbation.
#
# Generated by derive_double_harris.py -- DO NOT hand-edit the derived
# numbers below; edit the free choices (n0, v_a, *_VMAX_MULTIPLE, DV_*,
# SPARSITY_REL_BACKGROUND, THETA, LOW_PASS_FILTER, CURRENT_LOADING, SYMMETRY_SEED,
# SEED_WIDTH_LAMBDA0, GEOMETRY, NY, DT_TCI, MODE, VDF_SHEET_LINES, WALL_BLOCK_MARGIN,
# X_CELLS_1D, FROZEN_FIELDS, T_MAX_TCI, *_EVERY_TCI) at the top of that script
# and rerun instead, so this file and its derivation stay in sync.
#
# Deliberate deviations from the paper: velocity boxes +-16v_ti and +-12v_te
# with 64 and 80 cells per dimension instead of +-9v_ti and +-8v_te with 26
# (Vlasiator's velocity blocks are 4 cells wide); dv=0.500v_ti and 0.300v_te
# instead of 0.692 and 0.615; theta=0.55 instead of 1/2 (the paper's value
# unless otherwise specified); sparse velocity mesh, blocks below 0.0001 of the
# background peak f dropped (the paper's velocity grids are full); sheet drifts
# scaled to match the solver's discrete curl B (currentLoading=1); velocity-
# space edges drop (+v) or pile up (-v) what is pushed past them.
#
# Dimensionless cross-checks against the paper (computed by derive_gem.py;
# these should match to machine precision for ANY choice of n0/v_a -- they
# do not depend on c, unlike c/v_a itself):
#   v_ti/v_a=0.645497 (target sqrt(5/12)=0.645497)
#   v_te/v_a=1.443376 (target sqrt(25/12)=1.443376)
#   v_di/v_a=-1.666667 (target -5/3=-1.666667)
#   v_de/v_a=0.333333 (target 1/3=0.333333)
# (w_pe/w_ci=100.000000, paper states 100 -- but this ratio is
#  algebraically 5*(c/v_a), so it only equals 100 when c/v_a=20 is chosen; it
#  is not an independent check of this run's n0/v_a, just of that choice)

dynamic_timestep = 0
project = Harris
ParticlePopulations = proton
ParticlePopulations = electron

propagate_field = 1
propagate_vlasov_translation = 1
propagate_vlasov_acceleration = 1

[io]
diagnostic_write_interval = 10
write_initial_state = 0
system_write_t_interval = 1.519122663e-03
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0
# VDFs: every 16th cell, plus every cell of rows 0, 34
system_write_t_interval = 6.076490653e-02
system_write_file_name = distributions
system_write_distribution_stride = 16
system_write_distribution_xline_stride = 1
system_write_distribution_yline_stride = 34
system_write_distribution_zline_stride = 1
restart_walltime_interval = 7200

[gridbuilder]
x_length = 128
y_length = 68
z_length = 1
x_min = -2.914697712e+06
x_max = 2.914697712e+06
y_min = -1.548433159e+06
y_max = 1.548433159e+06
z_min = -2.277107587e+04
z_max = 2.277107587e+04

dt = 3.038245329e-04
t_max = 6.076490659e-01

[bailout]
min_dt = 3.038e-07
velocity_space_wall_block_margin = 0

[boundaries]
periodic_x = yes
periodic_y = no
periodic_z = yes
boundary = ConductingWall
# The 2 outermost rows at each y face are the walls' boundary layers; the walls sit
# between them and the interior, at y = +-1.457348856e+06 m (+-6.4 lambda_i).

[proton_conductingwall]
face = y+
face = y-

[electron_conductingwall]
face = y+
face = y-

[fieldsolver]
method = AP
theta = 0.55
enforceGaussLaw = 1
lowPassFilter = 0

[Harris]
Scale_size = 1.138553794e+05
BX0 = 6.872179377e-07
BY0 = 0.0
BZ0 = 0.0
perturbationAmplitude = 1.564869180e-02
doubleSheet = 0
currentLoading = 1
symmetrySeed = 0.05
symmetrySeedWidth = 2

[proton_Harris]
Temperature = 1.134185725e+10
rho = 1.000000000e+06
rhoBackground = 2.000000000e+05

[electron_Harris]
Temperature = 2.268371450e+09
rho = 1.000000000e+06
rhoBackground = 2.000000000e+05

[proton_properties]
mass = 1.0
mass_units = PROTON
charge = 1

[electron_properties]
mass = 0.04
mass_units = PROTON
charge = -1

[proton_vspace]
# 16 blocks x WID=4 over +-16 v_ti: dv=0.500 v_ti (target 0.5)
vx_min = -1.548121596e+08
vx_max = 1.548121596e+08
vy_min = -1.548121596e+08
vy_max = 1.548121596e+08
vz_min = -1.548121596e+08
vz_max = 1.548121596e+08
vx_length = 16
vy_length = 16
vz_length = 16

[proton_sparse]
# 0.0001 x background peak f (both species); 3 spare block(s) before the wall at t=0
minValue = 1.401861e-21

[electron_vspace]
# 20 blocks x WID=4 over +-12 v_te: dv=0.300 v_te (target 0.3)
vx_min = -2.596278845e+08
vx_max = 2.596278845e+08
vy_min = -2.596278845e+08
vy_max = 2.596278845e+08
vz_min = -2.596278845e+08
vz_max = 2.596278845e+08
vx_length = 20
vy_length = 20
vz_length = 20

[electron_sparse]
# 0.0001 x background peak f (both species); 5 spare block(s) before the wall at t=0
minValue = 1.253863e-22

[variables]
output = populations_vg_rho
output = populations_vg_v
output = populations_vg_ptensor
output = populations_vg_blocks

output = vg_rhom
output = vg_rhoq

output = fg_e
output = fg_b
output = vg_e_vol
output = vg_b_vol

output = populations_vg_nonmaxwellianess

output = vg_rank
output = vg_boundarytype
diagnostic = populations_vg_blocks
