# DOUBLE Harris-sheet variant of the GEM reconnection challenge
#
# Overrides: MODE=2d FROZEN_FIELDS=False T_MAX_TCI=40.0 CURRENT_LOADING=1 SYMMETRY_SEED=0.05 ELECTRON_VMAX_MULTIPLE=16.0 DT_TCI=0.004 CFG_TAG=_cl1_seed05_v16
#
# Deliberate deviations from the paper: dt=0.004/w_ci instead of 0.02/w_ci;
# velocity boxes +-16v_ti and +-16v_te instead of +-9v_ti and +-8v_te; dx=dy=0.1
# lambda_i instead of 0.2; dv=0.500v_ti and 0.296v_te instead of 0.692 and
# 0.615; theta=1 instead of 1/2.

dynamic_timestep = 0
project = Harris
ParticlePopulations = proton
ParticlePopulations = electron

propagate_field = 1
propagate_vlasov_translation = 1
propagate_vlasov_acceleration = 1

[io]
diagnostic_write_interval = 10
write_initial_state = 0
system_write_t_interval = 1.519122663e-03
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0
# VDFs for wall_scan.py
system_write_t_interval = 6.076490653e-02
system_write_file_name = distributions
system_write_distribution_stride = 16
system_write_distribution_xline_stride = 1
system_write_distribution_yline_stride = 64
system_write_distribution_zline_stride = 1
# restart writes
restart_walltime_interval = 7200

[gridbuilder]
x_length = 256
y_length = 256
z_length = 1
x_min = -2.914697712e+06
x_max = 2.914697712e+06
y_min = -2.914697712e+06
y_max = 2.914697712e+06
z_min = -1.138553794e+04
z_max = 1.138553794e+04

dt = 6.076490659e-05
t_max = 6.076490659e-01

[bailout]
min_dt = 6.076e-08
velocity_space_wall_block_margin = 0

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = yes
# No "boundary = ..." line: fully periodic in all three dimensions, so there
# is no open/wall face anywhere for a boundary condition to apply to.

[fieldsolver]
method = AP
theta = 1
enforceGaussLaw = 1
lowPassFilter = 0

[Harris]
Scale_size = 1.138553794e+05
BX0 = 6.872179377e-07
BY0 = 0.0
BZ0 = 0.0
perturbationAmplitude = 1.564869180e-02
doubleSheet = 1
currentLoading = 1
symmetrySeed = 0.05
symmetrySeedWidth = 2

[proton_Harris]
Temperature = 1.134185725e+10
rho = 1.000000000e+06
rhoBackground = 2.000000000e+05

[electron_Harris]
Temperature = 2.268371450e+09
rho = 1.000000000e+06
rhoBackground = 2.000000000e+05

[proton_properties]
mass = 1.0
mass_units = PROTON
charge = 1

[electron_properties]
mass = 0.04
mass_units = PROTON
charge = -1

[proton_vspace]
# 16 blocks x WID=4 over +-16 v_ti: dv=0.500 v_ti (target 0.5)
vx_min = -1.548121596e+08
vx_max = 1.548121596e+08
vy_min = -1.548121596e+08
vy_max = 1.548121596e+08
vz_min = -1.548121596e+08
vz_max = 1.548121596e+08
vx_length = 16
vy_length = 16
vz_length = 16

[proton_sparse]
# 0.0001 x background peak f (both species); 2 spare block(s) before the wall at t=0
minValue = 1.401861e-21

[electron_vspace]
# 27 blocks x WID=4 over +-16 v_te: dv=0.296 v_te (target 0.3)
vx_min = -3.461705127e+08
vx_max = 3.461705127e+08
vy_min = -3.461705127e+08
vy_max = 3.461705127e+08
vz_min = -3.461705127e+08
vz_max = 3.461705127e+08
vx_length = 27
vy_length = 27
vz_length = 27

[electron_sparse]
# 0.0001 x background peak f (both species); 7 spare block(s) before the wall at t=0
minValue = 1.253863e-22

[variables]
output = populations_vg_rho
output = populations_vg_v
output = populations_vg_ptensor
output = populations_vg_blocks

output = vg_rhom
output = vg_rhoq

output = fg_e
output = fg_b
output = vg_e_vol
output = vg_b_vol

output = populations_vg_nonmaxwellianess

output = vg_rank
output = vg_boundarytype
diagnostic = populations_vg_blocks
